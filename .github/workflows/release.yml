name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Check whether this version needs a release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: version
        run: node scripts/prepare-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            arch: arm64
            runner: macos-15
            command: npm run app:dist:mac -- --arm64
          - platform: macOS
            arch: x64
            runner: macos-15-intel
            command: npm run app:dist:mac -- --x64
          - platform: Windows
            arch: x64
            runner: windows-2025
            command: npm run app:dist:win
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Package
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify package contents and executable
        run: npm run app:verify -- ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/Jimyeon-*-macOS-${{ matrix.arch }}.dmg
            release/Jimyeon-*-macOS-${{ matrix.arch }}.zip
            release/Jimyeon-*-Windows-${{ matrix.arch }}-Setup.exe
            release/Jimyeon-*-Windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  draft-release:
    name: Verify uploads and publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - name: Upload, verify checksums and publish
        run: node scripts/create-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ github.event_name == 'push' }}
